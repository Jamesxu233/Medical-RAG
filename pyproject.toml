[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical_rag"
version = "0.1.0"
description = "Medical query understanding and PubMed retrieval pipeline"
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "torch>=2.2",
    "transformers>=4.45",
    "sentence-transformers>=3.0",
    "tokenizers>=0.20",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.26",
    "chromadb>=0.5",
    "pyarrow>=18.0",
    "tqdm>=4.67",
    "nltk>=3.9",
    "regex>=2024.11",
    "requests>=2.32",
    "typing_extensions>=4.12"
]

[tool.setuptools.packages.find]
where = ["src"]